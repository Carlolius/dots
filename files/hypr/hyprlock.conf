# Generado por ~/.config/tema/aplicar.sh desde la paleta: no editar a mano (editar plantillas/hyprlock-completo.conf).
animations {
    enabled = false
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fondo: tu fondo de pantalla desenfocado y oscurecido (no enseña lo que hubiera en pantalla)
background {
    monitor =
    path = /home/carlos/Descargas/fotos/mario mushroom.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.40
    contrast = 0.95
    vibrancy = 0.15
}

# Hora a dos tonos: horas en blanco, minutos en el acento
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = rgba(c0caf5ff)
    font_size = 230
    font_family = Hack Nerd Font Bold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(000000aa)
    position = -207, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = :
    color = rgba(bb9af7ff)
    font_size = 230
    font_family = Hack Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = rgba(7aa2f7ff)
    font_size = 230
    font_family = Hack Nerd Font Bold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(000000aa)
    position = 207, 190
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date "+%A, %d de %B"
    color = rgba(bb9af7ff)
    font_size = 28
    font_family = Hack Nerd Font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(000000aa)
    position = 0, 35
    halign = center
    valign = center
}

# Saludo
label {
    monitor =
    text = cmd[update:3600000] /home/carlos/.config/sway/scripts/lock-info.sh saludo
    color = rgba(c0caf5cc)
    font_size = 20
    font_family = Hack Nerd Font
    position = 0, -25
    halign = center
    valign = center
}

# Campo de contraseña: pastilla con borde en degradado
input-field {
    monitor =
    size = 420, 66
    outline_thickness = 3
    rounding = -1
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    inner_color = rgba(1a1b26e6)
    font_color = rgba(c0caf5ff)
    check_color = rgba(e0af68ff) rgba(9ece6aff) 120deg
    fail_color = rgba(f7768eff) rgba(e0af68ff) 40deg
    capslock_color = rgba(e0af68ff)
    fade_on_empty = false
    placeholder_text = <i>󰌾  Contraseña</i>
    fail_text = <i>󰀦  Incorrecta ($ATTEMPTS)</i>
    hide_input = false
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(000000aa)
    position = 0, -110
    halign = center
    valign = center
}

# Distribución del teclado (abajo a la derecha)
label {
    monitor =
    text = $LAYOUT[es,us]
    color = rgba(c0caf5cc)
    font_size = 16
    font_family = Hack Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# Batería (abajo a la izquierda)
label {
    monitor =
    text = cmd[update:30000] /home/carlos/.config/sway/scripts/lock-info.sh bateria
    color = rgba(c0caf5cc)
    font_size = 16
    font_family = Hack Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

# Lo que suena (abajo, centrado; vacío si no hay nada)
label {
    monitor =
    text = cmd[update:2000] /home/carlos/.config/sway/scripts/lock-info.sh musica
    color = rgba(bb9af7ff)
    font_size = 16
    font_family = Hack Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
