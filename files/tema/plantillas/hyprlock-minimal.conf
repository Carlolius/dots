# Generado por ~/.config/tema/aplicar.sh desde la paleta: no editar a mano (editar plantillas/hyprlock-minimal.conf).
# Estilo minimalista: solo la hora y, al teclear, un campo discreto.
animations {
    enabled = false
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @fondo@
    blur_passes = 4
    blur_size = 9
    brightness = 0.32
    contrast = 0.9
    vibrancy = 0.1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(@fg@f2)
    font_size = 160
    font_family = Hack Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
    position = 0, 40
    halign = center
    valign = center
}

# Fecha, discreta
label {
    monitor =
    text = cmd[update:60000] date "+%A %d %B"
    color = rgba(@fg@99)
    font_size = 18
    font_family = Hack Nerd Font
    position = 0, -90
    halign = center
    valign = center
}

# Campo de contraseña: solo aparece al teclear
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = @r3@
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(@accent@cc)
    inner_color = rgba(@bg@b3)
    font_color = rgba(@fg@ff)
    check_color = rgba(@yellow@ff)
    fail_color = rgba(@urgent@ff)
    capslock_color = rgba(@yellow@ff)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    fail_text = <i>$ATTEMPTS</i>
    hide_input = false
    position = 0, -170
    halign = center
    valign = center
}
