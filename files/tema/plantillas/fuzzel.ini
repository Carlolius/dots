[main]
exit-on-keyboard-focus-loss=no
font=Hack Nerd Font:size=13
terminal=foot -e
prompt=" "
icon-theme=Papirus-Dark
width=45
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=26

[colors]
background=@bg@f2
text=@fg@ff
prompt=@accent2@ff
placeholder=@dim@ff
input=@fg@ff
match=@accent2@ff
selection=@bg2@ff
selection-text=@fg@ff
selection-match=@accent@ff
border=@accent@ff

[border]
width=2
radius=@r3@
