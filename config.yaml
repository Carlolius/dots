config:
  backup: true
  create: true
  dotpath: files
  longkey: true
  showdiff: true
dotfiles:
  d_foot:
    src: foot
    dst: ~/.config/foot
  f_ayk-startup-script:
    src: scripts/ayk_startup.sh
    dst: ~/scripts/ayk_startup.sh
  f_screenlock:
    src: scripts/screenlock.sh
    dst: ~/scripts/screenlock.sh
  f_ayk-startup-service:
    src: systemd/ayk_startup.service
    dst: ~/.config/systemd/user/ayk_startup.service
  f_ayk-startup-timer:
    src: systemd/ayk_startup.timer
    dst: ~/.config/systemd/user/ayk_startup.timer
  d_tmux:
    src: tmux
    dst: ~/.config/tmux
  f_alacritty:
    src: alacritty/alacritty.toml
    dst: ~/.config/alacritty/alacritty.toml
  f_sxhkd:
    src: sxhkd/sxhkdrc
    dst: ~/.config/sxhkd/sxhkdrc
  d_zshrc:
    src: zsh
    dst: ~/.config/zsh
  f_aliases:
    src: aliases
    dst: ~/.config/aliases
  f_bashrc:
    src: bash/bashrc
    dst: ~/.bashrc
  f_envrc:
    src: envrc
    dst: ~/.config/envrc
  f_functions:
    src: functions
    dst: ~/.config/functions
  f_profile:
    src: bash/profile
    dst: ~/.profile
  d_polybar:
    src: polybar
    dst: ~/.config/polybar
    upignore:
    - '*/scripts/env.sh'
  d_waybar:
    src: waybar
    dst: ~/.config/waybar
  f_conkyrc:
    src: conky/conkyrc
    dst: ~/.config/conky/conkyrc
  f_conkyrc2:
    src: conky/conkyrc2
    dst: ~/.config/conky/conkyrc2
  f_inicio-conky:
    src: conky/inicio-conky.sh
    dst: ~/.config/conky/inicio-conky.sh
  f_rofi-config:
    src: rofi/config.rasi
    dst: ~/.config/rofi/config.rasi
  f_rofi-personal:
    src: rofi/personal.rasi
    dst: ~/.config/rofi/personal.rasi
  d_nvim-lua:
    src: nvim/lua
    dst: ~/.config/nvim/lua
  f_nvim-init:
    src: nvim/init.lua
    dst: ~/.config/nvim/init.lua
  f_nvim-lazy-lock:
    src: nvim/lazy-lock.json
    dst: ~/.config/nvim/lazy-lock.json
  d_sway:
    src: sway
    dst: ~/.config/sway
  d_environment:
    src: environment.d
    dst: ~/.config/environment.d
  d_vim-config-plugins:
    src: vim/config-plugins
    dst: ~/.vim/config-plugins
  d_vim-settings:
    src: vim/settings
    dst: ~/.vim/settings
  f_vim-vimrc:
    src: vim/vimrc
    dst: ~/.vim/vimrc
  f_xinitrc:
    src: X/xinitrc
    dst: ~/.xinitrc
  f_xprofile:
    src: X/xprofile
    dst: ~/.xprofile
  f_xresources:
    src: X/Xresources
    dst: ~/.Xresources
  f_zshenv:
    src: zshenv
    dst: ~/.zshenv
  d_kanshi:
    src: kanshi
    dst: ~/.config/kanshi
  d_tema:
    src: tema
    dst: ~/.config/tema
  d_fuzzel:
    src: fuzzel
    dst: ~/.config/fuzzel
  d_swaync:
    src: swaync
    dst: ~/.config/swaync

profiles:
  bender:
    include:
    - X
    - conky
    - nvim
    - rofi
    - sh
    - vim
    dotfiles:
    - d_polybar
    - d_tmux
    - f_alacritty
    - f_sxhkd

  kug:
    include:
    - nvim
    - sway
    - sh
    dotfiles:
    - d_tmux
    - d_foot
    - d_waybar
    - f_rofi-config

  nibbler:
    include:
    - X
    - nvim
    - rofi
    - sh
    - vim
    dotfiles:
    - d_polybar
    - f_screenlock
    - d_tmux
    - f_sxhkd

  server:
    include:
    - nvim
    dotfiles:
    - f_aliases

  yanos:
    include:
    - conky
    - nvim
    - rofi
    - sh
    - sway
    - vim
    dotfiles:
    - d_foot
    - f_ayk-startup-script
    - f_ayk-startup-service
    - f_ayk-startup-timer
    - d_tmux
    - d_waybar
    - f_aliases
    - d_swaync
    - d_fuzzel
    - d_tema
    - d_kanshi

# Packages used above
  conky:
    dotfiles:
    - f_conkyrc
    - f_conkyrc2
    - f_inicio-conky

  nvim:
    dotfiles:
    - d_nvim-lua
    - f_nvim-init
    - f_nvim-lazy-lock

  rofi:
    dotfiles:
    - f_rofi-config
    - f_rofi-personal

  sh:
    dotfiles:
    - d_zshrc
    - f_aliases
    - f_bashrc
    - f_envrc
    - f_functions
    - f_profile
    - f_zshenv

  sway:
    dotfiles:
    - d_sway
    - d_environment

  vim:
    dotfiles:
    - d_vim-config-plugins
    - d_vim-settings
    - f_vim-vimrc

  X:
    dotfiles:
    - f_xinitrc
    - f_xprofile
    - f_xresources
